<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training-tools 画面幅検証</title>
<style>body{margin:0;background:#dedede;font:14px sans-serif}header{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px;background:#242424;color:white}button{min-height:32px;padding:4px 8px}main{padding:6px}iframe{display:block;border:1px solid #333;background:white}output{font-variant-numeric:tabular-nums}</style>
<header><strong>画面幅検証</strong><button data-size="1280,800">PC 1280×800</button><button data-size="390,844">縦 390×844</button><button data-size="320,568">縦 320×568</button><button data-size="320,480">縦 320×480</button><button data-size="844,390">横 844×390</button><button data-size="568,320">横 568×320</button><output id="size">1280×800</output></header>
<main><iframe id="preview" title="Training-tools 検証画面" src="../index.html?qa=d8c4b32" width="1280" height="800"></iframe></main>
<script>const frame=document.getElementById('preview');for(const button of document.querySelectorAll('button[data-size]'))button.onclick=()=>{const [w,h]=button.dataset.size.split(',');frame.width=w;frame.height=h;document.getElementById('size').textContent=w+'×'+h;};</script>
</html>
