name: Verify published front-reference measurements
on:
  push:
    branches: [codex/multi-machine-sweep-20261006]
permissions:
  contents: read
jobs:
  browser:
    name: Chromium five-machine verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install browser runtime
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify generated bundle
        run: |
          python3 build.py
          git diff --exit-code -- index.html
      - name: Match public page to commit 656d1f5fa46c828c88ef2be9af5fcaba75da1baa
        env:
          PUBLIC_PAGE_URL: https://tgkfnfnfv9-stack.github.io/Training-tools/?verify=656d1f5fa46c828c88ef2be9af5fcaba75da1baa
        run: |
          python3 - <<'PY'
          import hashlib, os, time, urllib.request
          from pathlib import Path
          expected = Path('index.html').read_bytes()
          for attempt in range(12):
              with urllib.request.urlopen(os.environ['PUBLIC_PAGE_URL'], timeout=30) as response:
                  actual = response.read()
              if actual == expected:
                  print('PUBLIC_BUNDLE_MATCH 656d1f5fa46c828c88ef2be9af5fcaba75da1baa sha256=' + hashlib.sha256(actual).hexdigest())
                  break
              if attempt == 11:
                  raise SystemExit('Published HTML differs from the verified build')
              time.sleep(5)
          PY
      - name: Check compact regression and five-machine layouts
        env:
          DIAL_BASE_URL: https://tgkfnfnfv9-stack.github.io/Training-tools/?verify=656d1f5fa46c828c88ef2be9af5fcaba75da1baa
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/multi-server.log 2>&1 &
          node tests/browser-simultaneous-dial.cjs
          node tests/browser-multi-sweep.cjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: front-reference-published-evidence
          path: |
            tmp/qa-dial/
            tmp/qa-multi-sweep/
          if-no-files-found: ignore
