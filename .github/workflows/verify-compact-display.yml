name: Verify published compact measurement display
on:
  push:
    branches: [codex/compact-display-20261006]
permissions:
  contents: read
jobs:
  browser:
    name: Chromium layout and interaction checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify generated page matches source
        run: |
          python3 build.py
          git diff --exit-code -- index.html
      - name: Verify published HTML matches commit 156a25fecdfd7cb621e47f314aef71fa0c70031d
        env:
          PUBLIC_PAGE_URL: https://tgkfnfnfv9-stack.github.io/Training-tools/?verify=156a25fecdfd7cb621e47f314aef71fa0c70031d
        run: |
          python3 - <<'PY'
          import hashlib, os, time, urllib.request
          from pathlib import Path
          expected = Path('index.html').read_bytes()
          for attempt in range(12):
              with urllib.request.urlopen(os.environ['PUBLIC_PAGE_URL'], timeout=30) as response:
                  actual = response.read()
              if actual == expected:
                  print('PUBLIC_BUNDLE_MATCH 156a25fecdfd7cb621e47f314aef71fa0c70031d sha256=' + hashlib.sha256(actual).hexdigest())
                  break
              if attempt == 11:
                  raise SystemExit('Published HTML differs from the verified build')
              time.sleep(5)
          PY
      - name: Verify browser layouts and interactions
        env:
          EMIT_SCREENSHOTS: '1'
          DIAL_BASE_URL: https://tgkfnfnfv9-stack.github.io/Training-tools/?verify=156a25fecdfd7cb621e47f314aef71fa0c70031d
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/dial-server.log 2>&1 &
          node tests/browser-simultaneous-dial.cjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-display-published-evidence
          path: tmp/qa-dial/
          if-no-files-found: ignore
