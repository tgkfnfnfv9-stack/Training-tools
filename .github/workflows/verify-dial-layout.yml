name: Verify published simultaneous dial layout
on:
  push:
    branches: [codex/verify-dial-layout-20261006]
permissions:
  contents: read
jobs:
  browser:
    name: Verify published page in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Check published HTML matches the approved build
        env:
          PUBLIC_PAGE_URL: https://tgkfnfnfv9-stack.github.io/Training-tools/?verify=ddf6492bc002592fd2f39991311fd0dc7816025e
        run: |
          python3 - <<'PY'
          import hashlib, os, urllib.request
          from pathlib import Path
          expected = Path('index.html').read_bytes()
          with urllib.request.urlopen(os.environ['PUBLIC_PAGE_URL'], timeout=45) as response:
              actual = response.read()
          if actual != expected:
              raise SystemExit('Published HTML does not match the verified repository build')
          print('PUBLIC_BUNDLE_MATCH ddf6492bc002592fd2f39991311fd0dc7816025e sha256=' + hashlib.sha256(actual).hexdigest())
          PY
      - name: Verify browser layouts and interactions
        env:
          EMIT_SCREENSHOTS: '1'
          DIAL_BASE_URL: https://tgkfnfnfv9-stack.github.io/Training-tools/
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/dial-server.log 2>&1 &
          node tests/browser-simultaneous-dial.cjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simultaneous-dial-browser-evidence
          path: tmp/qa-dial/
          if-no-files-found: ignore
