<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>表示サイズ検証</title><style>body{margin:12px;background:#eee;color:#222;font:16px system-ui}header{display:flex;gap:12px;align-items:center;margin-bottom:12px}select{font:inherit;padding:8px}iframe{border:1px solid #999;background:white;display:block}</style><header><strong>Training tools 表示サイズ検証</strong><label>画面サイズ <select id="size"><option value="320,568">320 × 568</option><option value="320,480">320 × 480</option><option value="390,844">携帯縦 390 × 844</option><option value="844,390">携帯横 844 × 390</option><option value="1024,768">PC 1024 × 768</option></select></label></header><iframe id="preview" title="教材の検証画面" src="../../index.html?qa=bed9-v1" width="320" height="568"></iframe><script>document.querySelector('#size').addEventListener('change',e=>{const [w,h]=e.target.value.split(',');const f=document.querySelector('#preview');f.width=w;f.height=h});</script></html>
