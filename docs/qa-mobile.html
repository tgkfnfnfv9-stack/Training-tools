<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>携帯表示の確認</title><style>body{margin:8px;background:#e5ecef;color:#18333f;font:13px system-ui}header{display:flex;align-items:center;gap:12px;min-height:34px}h1{font-size:14px;margin:0}select{font:inherit;padding:5px}iframe{display:block;border:1px solid #9daeb5;background:white;margin-top:8px;box-sizing:content-box;width:390px;height:844px}</style></head><body><header><h1>携帯表示の確認</h1><label>画面サイズ <select id="qaSize"><option value="390,844">390 × 844</option><option value="360,640">360 × 640</option><option value="844,390">844 × 390（横向き）</option><option value="768,1024">768 × 1024</option></select></label></header><iframe id="qaApp" title="訓練ツールの携帯表示" src="../index.html"></iframe><script>document.getElementById('qaSize').addEventListener('change',event=>{const [w,h]=event.target.value.split(',');const frame=document.getElementById('qaApp');frame.style.width=w+'px';frame.style.height=h+'px';});</script></body></html>
